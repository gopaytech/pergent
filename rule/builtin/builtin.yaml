  - path: "**/*.nix"
    rule_file: nix.md
  - path: "**/*.{hs,lhs}"
    rule_file: haskell.md
  - path: "**/*.{nim,nims,nimble}"
    rule_file: nim.md
  - path: "**/*.swift"
