<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="pergent: an owl reviewing a diff">
  <title>pergent</title>
  <defs><clipPath id="badge"><circle cx="128" cy="128" r="122"/></clipPath></defs>
  <g clip-path="url(#badge)">
    <rect width="256" height="256" fill="#3D4BA8"/>
    <!-- the branch it sits on: a diff, one added and one removed line -->
    <rect x="34" y="196" width="188" height="14" rx="7" fill="#2A3580"/>
    <rect x="44" y="218" width="120" height="10" rx="5" fill="#4FC38A"/>
    <rect x="44" y="234" width="84" height="10" rx="5" fill="#E8615A"/>
    <!-- ears -->
    <path d="M84 78 L92 46 L112 70 Z" fill="#1B2240"/>
    <path d="M172 78 L164 46 L144 70 Z" fill="#1B2240"/>
    <!-- body -->
    <ellipse cx="128" cy="134" rx="62" ry="68" fill="#1B2240"/>
    <!-- belly -->
    <ellipse cx="128" cy="164" rx="36" ry="34" fill="#2E3A78"/>
    <path d="M110 160 l12 12 l22 -24" fill="none" stroke="#4FC38A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- eyes, with reading glasses -->
    <circle cx="104" cy="110" r="24" fill="#FFFFFF"/>
    <circle cx="152" cy="110" r="24" fill="#FFFFFF"/>
    <circle cx="104" cy="110" r="24" fill="none" stroke="#F2B544" stroke-width="5"/>
    <circle cx="152" cy="110" r="24" fill="none" stroke="#F2B544" stroke-width="5"/>
    <path d="M126 106 Q128 102 130 106" fill="none" stroke="#F2B544" stroke-width="4" stroke-linecap="round"/>
    <circle cx="108" cy="114" r="9" fill="#1B2240"/>
    <circle cx="156" cy="114" r="9" fill="#1B2240"/>
    <circle cx="111" cy="111" r="3" fill="#FFFFFF"/>
    <circle cx="159" cy="111" r="3" fill="#FFFFFF"/>
    <!-- beak -->
    <path d="M120 134 L136 134 L128 146 Z" fill="#F2B544"/>
    <!-- feet on the branch -->
    <path d="M106 198 v-6 M112 198 v-8 M118 198 v-6" stroke="#F2B544" stroke-width="4" stroke-linecap="round"/>
    <path d="M138 198 v-6 M144 198 v-8 M150 198 v-6" stroke="#F2B544" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#273279" stroke-width="5"/>
</svg>
